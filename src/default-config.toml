[prompt]
# 在 shell 提示符前显示会话名称。
# Show the session name before the shell prompt.
show_session = true

[list]
# 设置 CREATED 列的 strftime 时间格式。
# Set the strftime time format for the CREATED column.
created_format = "%m-%d %H:%M:%S"

[completion]
# 启用 imx 命令和会话名称的 Tab 补全。
# Enable Tab completion for imx commands and session names.
enabled = true

[panes]
# 修改后在当前界面的会话或普通 shell 窗格中执行 imx reload 生效。
# Run imx reload from a session or plain shell pane in the current interface to apply changes.

# 启用鼠标聚焦、历史滚动、分隔线拖动、文字选择、会话列表选择和预览历史滚动。
# Enable mouse focus, history scrolling, separator dragging, text selection, session list selection, and preview history scrolling.
mouse = false

# 设置聚焦窗格的边框和标题颜色（"#RRGGBB"）。
# Set the focused pane's border and title color ("#RRGGBB").
focused_border_color = "#969CD5"
