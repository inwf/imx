[prompt]
# 在 Bash、Zsh 和 Fish 的提示符前显示当前会话名称，例如 [dev]。
# Show the current session name, such as [dev], before the Bash, Zsh, or Fish prompt.
show_session = true

[list]
# CREATED 列使用 strftime 格式，按后台进程的本地时区显示。
# Format the CREATED column with strftime in the backend process's local timezone.
created_format = "%m-%d %H:%M:%S"

[completion]
# 在 Bash、Zsh 和 Fish 中按 Tab 补全 imx 命令和已有会话名称。
# Enable Tab completion for imx commands and existing session names in Bash, Zsh, and Fish.
enabled = true

[keybindings]
# 分离当前连接。key 指定字符或按键名称，ctrl、alt、shift、super 指定修饰键。
# Detach this connection. Set key to a character or key name and use ctrl, alt, shift, super for modifiers.
# super 对应 macOS 的 Command；终端需要将该组合键发送给 imx。
# super corresponds to Command on macOS; the terminal must forward the key combination to imx.
# 修改后重新连接生效。例如 { key = 'x', ctrl = true } 表示 Ctrl+x。
# Reattach to apply changes. For example, { key = 'x', ctrl = true } means Ctrl+x.
detach = { key = '\', ctrl = true }

# 左右分屏，在当前目录启动普通 shell。默认快捷键是 Command+D。
# Split left and right, starting a plain shell in the current directory. Default: Command+D.
split_right = { key = 'd', super = true }

# 上下分屏，在当前目录启动普通 shell。默认快捷键是 Command+Shift+D。
# Split top and bottom, starting a plain shell in the current directory. Default: Command+Shift+D.
split_down = { key = 'd', super = true, shift = true }
