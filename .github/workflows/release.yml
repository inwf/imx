name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish; leave empty to run checks'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  prepare:
    name: Select build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      run_id: ${{ steps.select.outputs.run_id }}
    steps:
      - name: Configure temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select verified main build or build the selected commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_github.py prepare

  build:
    name: Build and test (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/work/zig-global-cache
    steps:
      - name: Configure temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          clean: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - name: Select weekly compilation cache
        id: cache-key
        env:
          TOOLCHAIN_HASH: ${{ hashFiles('.zig-version', 'scripts/ci-tools.json') }}
        run: printf 'key=imx-zig-v1-Linux-%s-%s-%s\n' "$ARCH" "$(date -u +%G-W%V)" "$TOOLCHAIN_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore compilation cache
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ steps.cache-key.outputs.key }}
          path: |
            .zig-cache
            zig-pkg
            work/zig-global-cache
            ~/.cache/imx-ci
      - name: Install test tools
        run: |
          sudo --preserve-env=TMPDIR apt-get update
          sudo --preserve-env=TMPDIR apt-get install -y vim zsh fish bash-completion shellcheck sudo util-linux passwd
          sudo chmod -R go-w /usr/share/zsh
          zsh -fc 'autoload -Uz compaudit; compaudit'
      - name: Set up build tools
        run: uv run --frozen --project tests python scripts/setup_ci.py
      - name: Check, test and package
        run: bash scripts/ci-check.sh
      - name: Save compilation cache
        if: github.ref == 'refs/heads/main' && env.RELEASE_TAG == '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ steps.cache-key.outputs.key }}
          path: |
            .zig-cache
            zig-pkg
            work/zig-global-cache
            ~/.cache/imx-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imx-${{ matrix.arch }}
          path: work/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish release
    needs: [prepare, build]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.run_id != '')) &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Configure temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          clean: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: imx-*
          merge-multiple: true
          path: work/release
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id || github.run_id }}
      - name: Publish verified assets
        run: bash scripts/publish.sh
