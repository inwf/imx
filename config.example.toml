# 配置路径：$XDG_CONFIG_HOME/imx/config.toml，未设置或为空时使用 ~/.config/imx/config.toml。
# Config path: $XDG_CONFIG_HOME/imx/config.toml, or ~/.config/imx/config.toml when unset or empty.
# 已启用的配置项采用内置默认值；详细说明见 docs/usage.md。
# Active entries use built-in defaults; see docs/usage.md for details.

[prompt]
# 在 shell 提示符前显示会话名称。
# Show the session name before the shell prompt.
show_session = true

[list]
# 设置 CREATED 列的 strftime 时间格式。
# Set the strftime time format for the CREATED column.
created_format = "%m-%d %H:%M:%S"

[completion]
# 启用 imx 命令和会话名称的 Tab 补全。
# Enable Tab completion for imx commands and session names.
enabled = true

[panes]
# 修改后退出整个界面并重新 attach 生效。
# Exit the entire interface and attach again to apply changes.

# 启用鼠标聚焦、历史滚动、分隔线拖动、文字选择和会话列表选择。
# Enable mouse focus, history scrolling, separator dragging, text selection, and session list selection.
mouse = false

# 设置聚焦窗格的边框和标题颜色（"#RRGGBB"）。
# Set the focused pane's border and title color ("#RRGGBB").
focused_border_color = "#969CD5"

# 设置左右相邻窗格之间的空白列数，范围为 0 至 255。
# Set the blank columns between side-by-side panes, from 0 to 255.
horizontal_gap = 0

# 设置上下相邻窗格之间的空白行数，范围为 0 至 255。
# Set the blank rows between panes arranged top to bottom, from 0 to 255.
vertical_gap = 0

[keybindings]
# key 指定字符或按键名称；修饰键 ctrl/alt/shift/super 在绑定中省略时为 false。
# key names a character or key; omitted ctrl/alt/shift/super modifiers in a binding default to false.
# macOS 的 Option 对应 alt，Command 对应 super；快捷键不能重复。
# On macOS, Option is alt and Command is super; shortcuts must be unique.
# 修改后退出整个界面并重新 attach 生效。
# Exit the entire interface and attach again to apply changes.

# 分离当前连接，会话及其中的程序继续运行。
# Detach the current connection, keeping the session and its programs running.
detach = { key = '\', alt = true }

# 左右分屏，在当前窗格的目录启动 shell。
# Split left and right, starting a shell in the focused pane's directory.
split_right = { key = 'd', alt = true }

# 上下分屏，在当前窗格的目录启动 shell。
# Split top and bottom, starting a shell in the focused pane's directory.
split_down = { key = 'd', alt = true, shift = true }

# 关闭当前窗格并终止其中的会话及程序；保留会话请先 detach。
# Close the focused pane and terminate its session and programs; detach first to keep the session.
close_pane = { key = 'w', alt = true }

# 临时放大当前窗格，再次使用恢复原有布局。
# Temporarily zoom the focused pane; repeat to restore the layout.
zoom_pane = { key = 'z', alt = true }

# 按方向聚焦相邻窗格。
# Focus a neighboring pane in the given direction.
focus_left = { key = 'Left', alt = true }
focus_right = { key = 'Right', alt = true }
focus_up = { key = 'Up', alt = true }
focus_down = { key = 'Down', alt = true }

# 向箭头方向扩大当前窗格，将同侧边界移动一列或一行。
# Grow the focused pane by moving the edge on the arrow's side one column or row.
resize_left = { key = 'Left', alt = true, shift = true }
resize_right = { key = 'Right', alt = true, shift = true }
resize_up = { key = 'Up', alt = true, shift = true }
resize_down = { key = 'Down', alt = true, shift = true }

# 缩小当前窗格，将相反方向的边界沿箭头方向移动一列或一行。
# Shrink the focused pane by moving the opposite edge one column or row in the arrow direction.
shrink_left = { key = 'Left', alt = true, ctrl = true }
shrink_right = { key = 'Right', alt = true, ctrl = true }
shrink_up = { key = 'Up', alt = true, ctrl = true }
shrink_down = { key = 'Down', alt = true, ctrl = true }

# 窗格编号从 0 开始，Alt+0 至 Alt+9 聚焦对应编号的窗格。
# Pane numbers start at 0; Alt+0 through Alt+9 focus the matching pane number.
focus_0 = { key = '0', alt = true }
focus_1 = { key = '1', alt = true }
focus_2 = { key = '2', alt = true }
focus_3 = { key = '3', alt = true }
focus_4 = { key = '4', alt = true }
focus_5 = { key = '5', alt = true }
focus_6 = { key = '6', alt = true }
focus_7 = { key = '7', alt = true }
focus_8 = { key = '8', alt = true }
focus_9 = { key = '9', alt = true }
